# One-off workflow; removed after committing the generated snapshot.
name: Generate counterfactual data

on:
  push:
    branches: [exact-counterfactual-gains]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Generate and validate counterfactual data
        run: ./scripts/run-audit.sh
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Commit generated counterfactual data"
          git push
