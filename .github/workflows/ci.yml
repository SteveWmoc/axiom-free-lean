name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    # The complete Mathlib census takes about 32 minutes on a standard public runner.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Run the pinned audit suite
        run: ./scripts/run-audit.sh
      - name: Require committed results to be current
        run: git diff --exit-code -- results/
