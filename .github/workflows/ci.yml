name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Run the pinned audit suite
        run: ./scripts/run-audit.sh
      - name: Expose generated counterfactual data
        if: always()
        run: |
          if [[ -f results/CounterfactualGain.tsv ]]; then
            echo "BEGIN_COUNTERFACTUAL_GAIN"
            sed -n '1,220p' results/CounterfactualGain.tsv
            echo "END_COUNTERFACTUAL_GAIN"
          fi
      - name: Require committed results to be current
        run: git diff --exit-code -- results/
