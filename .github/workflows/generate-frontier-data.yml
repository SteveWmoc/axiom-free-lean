name: Generate frontier data

on:
  push:
    branches: [theorem-level-frontier-data]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Generate and validate theorem data
        run: ./scripts/run-audit.sh
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/TheoremData.tsv results/DirectDependencyFrequency.tsv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Commit generated theorem frontier data"
          git push
