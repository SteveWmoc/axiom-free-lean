name: Generate counterfactual data

on:
  push:
    branches: [exact-counterfactual-gains]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-counterfactual-data
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: exact-counterfactual-gains
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-mathlib-cache: true
      - name: Generate and validate pinned results
        run: ./scripts/run-audit.sh
      - name: Show leading counterfactual gains
        run: sed -n '1,16p' results/CounterfactualGain.tsv
      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "Results are already current."
            exit 0
          fi
          git commit -m "Generate counterfactual gain data"
          git push origin HEAD:exact-counterfactual-gains
